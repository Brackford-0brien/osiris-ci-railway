[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/osiris-entrypoint.sh"
healthcheckPath = "/glpi/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Volume retiré : le montage sur /var/www/html/glpi masquait les fichiers GLPI de l'image
# Les données persistantes sont dans Railway MySQL
